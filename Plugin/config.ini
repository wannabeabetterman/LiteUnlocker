; SimpleUnlocker 配置文件
; 格式与原 FufuLauncher 完全兼容：每个键固定叫 Value
; 此文件需放在 SimpleUnlocker.dll 同目录（即 Plugins\ 目录下）
; 修改后无需重启游戏，支持热重载

; ====== 调试 ======
[DebugConsole]
Value=0
; 设为 1 会弹出一个控制台窗口，输出 hook 状态日志（发布时建议 0）

; ====== FPS 解锁 ======
[FpsUnlock]
Value=1
; 1=解锁帧率，0=不解锁

[TargetFps]
Value=120
; 目标帧率，常用 90 / 120 / 144 / 165 / 240
; 注意需配合关闭 VSync 才能真正突破上限

[VSync]
Value=1
; 1=强制关闭垂直同步（解锁帧率时建议保持 1）

; ====== FOV 修改 ======
[FovUnlock]
Value=1
; 1=修改视场角，0=不修改

[FovValue]
Value=60.0
; 目标 FOV（浮点数）。原神默认约 45，越大视野越广（鱼眼效果越明显）
; 常用范围：45（默认）~ 80（较广）

[FovLimitCheck]
Value=1
; 1=仅在当前 FOV>30 时才覆盖，保护过场动画等特殊镜头；0=无条件覆盖（不推荐）

[FovTransitionSpeed]
Value=0.05
; FOV 平滑过渡速度（0~1，每帧朝目标值靠近的比例）：
;   0.0  = 不过渡（瞬切，等同原版行为）
;   0.05 = 缓慢丝滑过渡（默认推荐）
;   0.2  = 较快过渡
;   1.0  = 立即到达（等于无过渡）
; 切场景/切队伍时 FOV 会平滑拉开，体验更自然

; ====== UI 体验优化 ======
[RemoveTeamAnim]
Value=1
; 1=移除队伍切换动画（直接显示队伍页面，跳过角色展示过渡），0=保持原版动画

[HideUID]
Value=1
; 1=隐藏屏幕右上角的 UID 水印（直播/截图隐私保护，仅本地显示，不影响联机），0=显示 UID
